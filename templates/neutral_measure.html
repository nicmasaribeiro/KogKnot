<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Neutral</title>
    <style>
        /* General Page Styling */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }

        h4 a {
            text-decoration: none;
            color: #007bff;
            font-size: 16px;
            font-weight: bold;
        }

        h4 a:hover {
            text-decoration: underline;
        }

        /* Form Styling */
        .form {
            display: flex;
            flex-direction: column;
            font-size: 16px;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            text-align: left;
        }

        input[type="text"], input[type="numeric"] {
            margin-bottom: 15px;
            padding: 12px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 100%;
            transition: border 0.3s;
        }

        input[type="text"]:focus, input[type="numeric"]:focus {
            border-color: #007bff;
            outline: none;
        }

        /* Submit Button */
        input[type="submit"] {
            padding: 12px;
            font-size: 1em;
            border: none;
            border-radius: 6px;
            background-color: #28a745;
            color: white;
            cursor: pointer;
            transition: background 0.3s ease-in-out;
        }

        input[type="submit"]:hover {
            background-color: #218838;
        }

        /* Result Section */
        .result-container {
            margin-top: 20px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .result-container h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 8px;
        }

        .risk-value {
            font-size: 22px;
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>

    <h4><a href="/">← Back</a></h4>

    <div class="container">
        <h1>Risk Neutral Calculation</h1>

        <form class="form" method="POST">
            <label>Enter Ticker</label>
            <input type="text" name="ticker" placeholder="Enter stock ticker">

            <label>Enter Period</label>
            <input type="text" name="period" placeholder="e.g., 1mo, 3mo, 1y, 2y, 3y, 5y">

            <label>Enter Interval</label>
            <input type="text" name="interval" placeholder="e.g., 1d, 1wk, 1mo, 3mo">

            <input type="submit" value="Calculate">
        </form>
    </div>

    <!-- Result Section -->
    <div class="result-container">
        <h3>The Risk Neutral Coefficient is:</h3>
        <p class="risk-value">{{ risk_neutral }}</p>
    </div>

</body>
</html>
